name: Reproduce paper results
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s New_Objective_Idea/tests -v
      - run: python Scripts/reproduce.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-report
          path: outputs/reproduction/
